# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"

# Layer true 24-bit RGB support on top of that -- default-terminal above
# caps tmux at the 256-color palette on its own, so raw #rrggbb colors (used
# to match tmux's powerline theme to Neovim's colorscheme, see the
# @powerline-color-main-1 override below) would otherwise get rounded to
# the nearest of those 256 colors instead of rendering exactly.
set -as terminal-features ",*:RGB"

############################################################
#
# GENERAL
#
############################################################

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Forward terminal focus events into panes, so Neovim's FocusGained fires when
# switching back to a pane (used to detect files changed outside Neovim, e.g.
# by an AI coding tool) -- without this, tmux swallows focus events and
# FocusGained never fires no matter what Neovim itself is configured to do.
set -g focus-events on


############################################################
#
# KEY BINDINGS
#
############################################################

# Prefix is C-space instead of the tmux default C-b -- checked against both
# the shell/readline and Neovim/blink.cmp defaults first: blink.cmp binds
# <C-space> to manually open the completion menu, but that's not something
# used day-to-day here, so no real conflict in practice.
set -g prefix C-space
bind-key C-space last-window

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# reload config file
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/cyan' # use this theme for tmux

# Override the theme's blue (its default is colour39, "#00afff") with
# tokyonight-night's own blue -- the same shade Neovim's statusline uses for
# its Normal-mode indicator (see nvim/.config/nvim/init.lua's mini.statusline
# config) -- so tmux's powerline segments and Neovim's statusline match
# instead of showing two different blues side by side. Must be set *before*
# TPM sources the theme (the `run` line at the bottom of this file): the
# theme sets @powerline-color-main-1 with `-goq` (only if unset), so setting
# it here first makes the theme adopt this color everywhere main-1 is used,
# rather than only patching one segment after the fact.
set -g @powerline-color-main-1 "#7aa2f7"

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality


############################################################
#
# CUSTOMIZE STATUS BAR
#
############################################################

## Set the status line's colors
#set -g status-style fg=white,bold,bg=black
#
## Set the color of the window list
#setw -g window-status-style fg=cyan,bg=black
#
## Set colors for the active window
#setw -g window-status-current-style fg=white,bold,bg=cyan
#
## Customize command line(default)
#set -g message-style fg=black,bg=yellow
#
## Status line left side to show Session:window:pane
#set -g status-left-length 40
#set -g status-left "#[fg=green] #S #[fg=yellow] #I #[fg=cyan] #P"
#
## Status line right side -  DD-MMM HH:MM
#set -g status-right "#[fg=cyan]%d %b %R"
#
## Update the status line every sixty seconds
#set -g status-interval 60
#
## Center the window list in the status line
#set -g status-justify centre
#

set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-keys vi
set -g status-position top # [top, bottom]
set -g status-style fg=colour136,bg=colour235
# solarized theme
#set -g status-style fg=colour136,bg="#002b36"

# Left status
set -g status-left-length 60
set -g status-left-style default

# Display the session name
# set -g status-left "#[fg=green] ❐ #S #[default]"

# Display the os version (OSX)
set -ag status-left " #[fg=black] #[fg=green,bright]  #(sw_vers -productVersion) #[default]"

# Display machine uptime
#set -ag status-left " #[fg=red,dim,bg=default]  #(uptime | cut -f 4-5 -d ' ' | cut -f 1 -d ',') #[default]"

# Display battery percentage 
#set -ag status-left "#[fg=green,bg=default,bright]  #(echo $(pmset -g batt) | grep -o '[0-9]*'%) #[default]"
# Use python2 to support older macs
set -ag status-left "#[fg=blue,bg=default,bright] 🔋 #(pmset -g batt | python2 -c 'import sys; sys.stdin.readline(); print sys.stdin.readline().split()[2][:3]') #[default]"


# Right status
set -g status-right-length 140
set -g status-right-style default

# Display the cpu load
set -g status-right "#[fg=green,bg=default,bright]  #(top -l 1 | grep -E "^CPU" | sed 's/.*://') #[default]"

# Display the date
set -ag status-right "#[fg=white,bg=default]  %a %d #[default]"

# Display the time
set -ag status-right "#[fg=colour172,bright,bg=default] ⌚︎%l:%M %p #[default]"

set -ag status-right "#[fg=cyan,bg=default] ☠ #H #[default]"

set -g window-status-style fg=colour244,bg=default
set -g window-status-format ' #I #W '

set -g window-status-current-style fg=black,bg=colour136
set -g window-status-current-format ' #I #W '

############################################################
#
# CUSTOMIZE ACTIVE PANE
#
############################################################

# Colors for pane borders(default)
setw -g pane-border-style fg=green,bg=black
setw -g pane-active-border-style fg=white,bg=black

# Active pane normal, other shaded out
setw -g window-style fg=colour240,bg=colour235
setw -g window-active-style fg=white,bg=black


############################################################
#
# VI MODE
#
############################################################
# enable vi keys.
setw -g mode-keys vi

# escape turns on copy mode
#bind Escape copy-mode

# v in copy mode starts making selection
bind-key -T copy-mode v send -X begin-selection
bind-key -T copy-mode y send -X copy-selection

# make Prefix p paste the buffer.
unbind p
bind p paste-buffer



############################################################
#
# MISC
#
############################################################

## enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Set mouse mode on
set -g mouse on

# clear the current pane
#bind -n C-k send-keys -R \; send-keys C-l \;

# Clear history like iterm/terminal
bind -n C-k clear-history

# Larger scroll back
set-option -g history-limit 100000


# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

############################################################
#
# PLUGINS
#
############################################################

# Initialize TMUX plugin manager -- this MUST be the actual last line in this
# file. It was previously placed higher up, before `bind -n C-k clear-history`;
# since tmux applies later bindings over earlier ones for the same key/table,
# that ordering silently overrode vim-tmux-navigator's C-k (move up) binding
# with plain clear-history. Keeping this line last ensures plugin-provided
# bindings always win over anything above them, matching TPM's own
# documented requirement.
run '~/.tmux/plugins/tpm/tpm'
