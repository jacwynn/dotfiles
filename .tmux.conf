# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"

# Layer true 24-bit RGB support on top of that -- default-terminal above
# caps tmux at the 256-color palette on its own, so raw #rrggbb colors (used
# throughout the hand-written status bar below, to match tokyonight-night's
# palette exactly) would otherwise get rounded to the nearest of those 256
# colors instead of rendering exactly.
set -as terminal-features ",*:RGB"

############################################################
#
# GENERAL
#
############################################################

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Forward terminal focus events into panes, so Neovim's FocusGained fires when
# switching back to a pane (used to detect files changed outside Neovim, e.g.
# by an AI coding tool) -- without this, tmux swallows focus events and
# FocusGained never fires no matter what Neovim itself is configured to do.
set -g focus-events on


############################################################
#
# KEY BINDINGS
#
############################################################

# Prefix is C-space instead of the tmux default C-b -- checked against both
# the shell/readline and Neovim/blink.cmp defaults first: blink.cmp binds
# <C-space> to manually open the completion menu, but that's not something
# used day-to-day here, so no real conflict in practice.
set -g prefix C-space
bind-key C-space last-window

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# reload config file
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# No theme plugin (tmux-themepack was used here previously) -- the status
# bar below is hand-written instead, using flat solid-color blocks (no
# powerline arrow glyphs at all) styled after craftzdog/dotfiles'
# tmux config, recolored to match tokyonight-night. Plain hex colors work
# directly in `#[fg=...,bg=...]` without needing a theme plugin's variable
# system, since RGB terminal-features is already on above.

# 12-hour format for tmux's full-screen clock-mode (prefix+t) -- tmux's own
# default is 24-hour. The status bar's own clock format is set directly in
# status-right below instead (no plugin-provided variable to override).
set -g clock-mode-style 12
set -g clock-mode-colour "#ff9e64"

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality


############################################################
#
# CUSTOMIZE STATUS BAR
#
############################################################

set -g status on
set -g status-interval 1
set -g status-justify right # window list flush to the right edge, since
# status-right is now empty (see below) -- nothing left to be *right of*.
set -g status-keys vi
set -g status-position bottom # [top, bottom] -- Neovim's own bufferline.nvim tab strip
# now sits at the top inside every pane, so tmux's bar moved down here instead of
# stacking two "top bars" on top of each other.

# tokyonight-night palette, matching Neovim's colorscheme (see
# nvim/.config/nvim/init.lua's mini.statusline config) -- but with its own
# accent, #ff9e64 (tokyonight's orange), rather than reusing the #7aa2f7
# blue Neovim's winbar/statusline and the OmniWM border all share. Tried
# matching that blue exactly first, but with tmux's bar sitting directly
# below Neovim's own statusline (see status-position above), identical
# colors made the two genuinely hard to visually tell apart -- a distinct,
# warm accent against that cool blue (tried tokyonight's purple in between,
# still too close in temperature/register to feel distinct) fixes that
# without breaking the overall color scheme. #1a1b26/#292e42 are
# tokyonight's own Normal/CursorLine background shades; #c0caf5 is its
# foreground -- these are unchanged, still shared with Neovim.
set -g status-style "fg=#c0caf5,bg=#1a1b26"

# Left status: session name (bright chip) then username (muted chip). The
# seam between them is a flat, direct color switch (no glyph) -- a rounded
# cap there (like the outer edge below has) put a visible bump between two
# chips meant to read as one continuous unit. The trailing edge, where the
# username chip exits into open space before the window list, keeps its
# round cap (U+E0B4) since that boundary *should* read as a distinct edge.
set -g status-left-length 60
set -g status-left "#[fg=#1a1b26,bg=#ff9e64,bold] #S #[fg=#c0caf5,bg=#292e42] #(whoami) #[fg=#292e42,bg=#1a1b26] "

# Right status: empty -- used to show the hostname, dropped since it
# wasn't serving any real purpose. With nothing here, status-justify right
# (above) puts the window list itself flush against the right edge instead.
set -g status-right-length 140
set -g status-right ""

# Window list: every window (active or not) gets its own number badge -- a
# small muted-grey (#24283b) pill around #I, same color regardless of
# active state, reading as a stable identifier separate from which window
# is focused. The badge chains directly into the window's name chip with
# no gap (same flat, direct color-switch technique as the session-name ->
# username seam above). The name chip's own color is what actually
# signals focus: the bright accent (matching the session-name chip) for
# the current window, a subtler muted grey (#292e42) for every other one.
#
# No separator between windows at all (below) -- every window snaps
# directly into the next, no gap, matching the same flat-seam idea used
# for the badge-to-name connection: since each window's own format
# unconditionally re-asserts its own badge color the instant it starts,
# whatever the previous window left behind gets overwritten immediately,
# with nothing in between. The only places that still need an explicit
# cap are the two true outer edges of the whole cluster -- entering from
# open space before the first window, and exiting into open space (or,
# here, the real screen edge) after the last one -- since those border
# actual open background, not another window. #{window_start_flag} and
# #{window_end_flag} (tmux's own "1 if this window has the lowest/highest
# index" format variables) gate those two caps respectively; every window
# in between gets neither. (The `#[fg=X]#[bg=Y]` split -- rather than the
# usual combined `#[fg=X,bg=Y]` -- is required specifically inside a
# `#{?cond,...}` conditional: tested empirically and confirmed the comma
# in the combined form gets parsed as the conditional's own argument
# separator, silently corrupting the whole expression.)
setw -g window-status-separator ""
set -g window-status-style "fg=#c0caf5,bg=default"
set -g window-status-format '#{?window_start_flag,#[fg=#24283b]#[bg=#1a1b26],}#[fg=#c0caf5,bg=#24283b,bold] #I #[fg=#c0caf5,bg=#292e42] #W #{?window_end_flag,#[fg=#292e42]#[bg=#1a1b26],}'

set -g window-status-current-style "fg=#1a1b26,bg=#ff9e64,bold"
set -g window-status-current-format '#{?window_start_flag,#[fg=#24283b]#[bg=#1a1b26],}#[fg=#c0caf5,bg=#24283b,bold] #I #[fg=#1a1b26,bg=#ff9e64,bold] #W #{?window_end_flag,#[fg=#ff9e64]#[bg=#1a1b26]#[nobold],}'

############################################################
#
# CUSTOMIZE ACTIVE PANE
#
############################################################

# Colors for pane borders(default)
setw -g pane-border-style fg=green,bg=black
setw -g pane-active-border-style fg=white,bg=black

# Active pane normal, other shaded out
setw -g window-style fg=colour240,bg=colour235
setw -g window-active-style fg=white,bg=black


############################################################
#
# VI MODE
#
############################################################
# enable vi keys.
setw -g mode-keys vi

# escape turns on copy mode
#bind Escape copy-mode

# v in copy mode starts making selection
bind-key -T copy-mode v send -X begin-selection
bind-key -T copy-mode y send -X copy-selection

# make Prefix p paste the buffer.
unbind p
bind p paste-buffer



############################################################
#
# MISC
#
############################################################

## enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Set mouse mode on
set -g mouse on

# clear the current pane
#bind -n C-k send-keys -R \; send-keys C-l \;

# Clear history like iterm/terminal
bind -n C-k clear-history

# Larger scroll back
set-option -g history-limit 100000


# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

############################################################
#
# PLUGINS
#
############################################################

# Initialize TMUX plugin manager -- this MUST be the actual last line in this
# file. It was previously placed higher up, before `bind -n C-k clear-history`;
# since tmux applies later bindings over earlier ones for the same key/table,
# that ordering silently overrode vim-tmux-navigator's C-k (move up) binding
# with plain clear-history. Keeping this line last ensures plugin-provided
# bindings always win over anything above them, matching TPM's own
# documented requirement.
run '~/.tmux/plugins/tpm/tpm'
