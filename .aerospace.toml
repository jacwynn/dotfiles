# AeroSpace tiling window manager -- https://github.com/nikitabobko/AeroSpace
#
# Operates one level above tmux: this tiles/manages whole macOS app windows
# (terminal, browser, etc), while tmux keeps handling panes *within* the
# terminal window. No overlap, so no keybinding conflicts by design -- this
# file deliberately sticks to Alt-based bindings, leaving tmux's Ctrl-based
# prefix (C-s) and vim-tmux-navigator's Ctrl-hjkl pane/split navigation alone.
#
# Left off at login for now -- flip to true once you're happy with the
# keybindings below and want it running automatically every session.
start-at-login = false

# Mostly cosmetic: small gaps between tiled windows so borders are easier to
# see. Set to 0 if you'd rather windows touch edge-to-edge.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Focus a window in a direction -- the AeroSpace-level equivalent of
# vim-tmux-navigator's Ctrl-hjkl, but Alt-based so it operates on whole
# windows/apps instead of tmux panes or nvim splits.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move the focused window itself in a direction
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Switch to workspace N (1-9) / send the focused window to workspace N
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Named workspaces for specific apps, jumped to directly by a letter instead
# of a number. Paired with the [[on-window-detected]] rules below, which
# auto-move each app there as soon as it launches -- so Alt-c/Alt-x both
# switch to that workspace *and* keep landing on the right app even if it
# isn't running yet.
alt-c = 'workspace C' # C for terminal (Ghostty)
alt-x = 'workspace X' # browser (Chrome)

# Same idea as alt-c/alt-x above, but these also launch the app itself (macOS's
# `open -a` both starts it if it's not running and activates its existing
# window if it already is), rather than assuming it's already open.
alt-e = ['workspace E', 'exec-and-forget open -a "Microsoft Outlook"'] # E for Email (Outlook)
alt-t = ['workspace T', 'exec-and-forget open -a "Microsoft Teams"']   # T for Teams
alt-n = ['workspace N', 'exec-and-forget open -a "Notion"']            # N for Notion

# Layout controls
alt-slash = 'layout tiles horizontal vertical' # toggle between horizontal/vertical tiling
alt-comma = 'layout accordion'                 # stack windows accordion-style instead
alt-enter = 'fullscreen'                       # toggle fullscreen for the focused window
alt-shift-space = 'layout floating tiling'     # toggle floating for the focused window

# Merge the focused window with its neighbor in a direction into one shared
# split container -- e.g. to get one window on the left and two stacked on
# the right: focus the right window, open/focus a third window, then
# alt-ctrl-k (or -j) to stack it with whichever neighbor is above/below.
# 'split' (AeroSpace's other, i3-style command for this) is a no-op here:
# enable-normalization-flatten-containers defaults to true and isn't
# overridden below, and AeroSpace's own docs say 'split' has no effect
# whenever that's on -- 'join-with' is the one that actually works.
alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

# Resize the focused window -- 'smart' resizes width or height depending on
# which way the window is actually split from its neighbor, so one pair of
# keys covers both instead of needing separate width/height bindings.
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Reload this config after editing it, without restarting AeroSpace
alt-shift-r = 'reload-config'

# Auto-assign apps to their named workspace (see alt-c/alt-x above) as soon
# as a window is detected, regardless of which workspace was active when it
# launched.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace X'

# UNVERIFIED: Outlook isn't installed on this machine, so this bundle ID is
# the standard/documented Microsoft Office one, not confirmed against a real
# install. If this rule doesn't fire once Outlook is actually installed,
# check the real ID with `aerospace list-apps` while it's running and fix
# this to match.
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace E'

# UNVERIFIED: two different lookups on this machine disagreed --
# `mdls`/the app's own Info.plist say `com.microsoft.teams`, but a live
# AppleScript query ("id of app") says `com.microsoft.teams2`. Going with
# teams2 since that's what's actually registered at runtime (what AeroSpace
# itself would see), but if this rule doesn't fire, check the real ID with
# `aerospace list-apps` while Teams is running and fix this to match.
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace T'

# Notion isn't currently installed either, but unlike Outlook this one's
# confirmed from leftover data on this machine from a previous install
# (~/Library/Preferences/notion.id.plist) -- an unusual bundle ID (no
# reverse-domain prefix) but a real, verified one, not a guess.
[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace N'
